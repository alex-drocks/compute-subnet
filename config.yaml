# ════════════════════════════════════════════════════════════════════
# NETWORK
# ════════════════════════════════════════════════════════════════════
attestation_layer:
  # Attestation Layer URL (centralized service for miner status, allocations, PoG results)
  url: "http://135.181.8.206/v1"
  # Auth token (can be overridden via environment variable)
  auth_token: ""
  # Timeout settings
  connect_timeout_sec: 5
  read_timeout_sec: 30
  # Retry settings (used by validator only)
  retry_max: 2
  retry_base_sec: 0.5
  retry_max_sec: 5.0
  retry_statuses: "408,429,500,502,503,504"
  # Cache TTL (used by validator only)
  cache_ttl_sec: 300

chain:
  network: "finney"
  rpc_http: ""
  rpc_wss: "wss://entrypoint-finney.opentensor.ai:443"
  request_timeout_sec: 6
  block_hash_cache: 1024

# ════════════════════════════════════════════════════════════════════
# MINER
# ════════════════════════════════════════════════════════════════════
miner:
  # Block intervals (1 block ≈ 12 seconds on Bittensor)
  block_interval_validator_update: 30    # ~6 minutes
  block_interval_specs_update: 150       # ~30 minutes
  block_interval_sync_status: 25         # ~5 minutes
  block_interval_allocation_check: 15    # ~3 minutes
  # Identity
  wallet_name: "miner_wallet"
  hotkey_name: "miner_hotkey"
  # Runtime paths
  run_root_path: "/dev/shm/miner"
  poll_sec: 0.5

  # Docker image security - whitelist of allowed images for allocation containers
  # Images not in this list will be rejected. Supports exact matches and prefix patterns.
  # Set to empty list [] to disable whitelist (DANGEROUS - allows any image)
  docker_image_whitelist:
    - "nirepo/default-pytorch:2.8.0-cuda12.8-cudnn9-runtime"  # Default image
    - "nirepo/"  # Allow all images from nirepo registry (prefix match)
    - "pytorch/pytorch:"  # Allow official PyTorch images (prefix match)
    - "nvidia/cuda:"  # Allow official NVIDIA CUDA images (prefix match)

# ════════════════════════════════════════════════════════════════════
# VALIDATOR
# ════════════════════════════════════════════════════════════════════
validator:
  # Block intervals
  block_interval_hardware_info: 150      # ~30 minutes
  block_interval_miner_check: 50         # ~10 minutes
  block_interval_sync_status: 25         # ~5 minutes
  block_interval_token_refresh: 600      # ~2 hours
  # Timeouts (seconds)
  pubsub_timeout_sec: 30
  ssh_timeout_sec: 5
  allocation_timeout_sec: 15
  deallocation_timeout_sec: 5
  # Retries
  allocation_max_retries: 2
  deallocation_max_retries: 1
  ssh_max_retries: 2
  validation_alloc_max_retries: 2
  retry_backoff_sec: 2
  # Config server
  server_ip: "65.108.33.88"
  server_port: "8000"
  pull_interval: 60

# ════════════════════════════════════════════════════════════════════
# PROOF OF GPU (PoG)
# ════════════════════════════════════════════════════════════════════
pog:
  # Miner scheduling
  exec_every_blocks: 5
  finalized_cache_ttl_sec: 10
  rpc_backoff_sec: 20
  allocation_grace_sec: 120
  # Validator scheduling
  pog_interval_blocks: 25
  allocation_sync_interval_blocks: 2
  batch_size: 128
  # Merkle proof params
  miner_script_path: "neurons/Validator/miner_script_m_merkletree.py"
  time_tolerance: 5
  submatrix_size: 512
  buffer_factor: 0.45
  spot_per_gpu: 3
  hash_algorithm: 'sha256'
  pog_retry_limit: 20
  pog_retry_interval: 60
  max_workers: 64
  max_random_delay: 600
  c_open_rows: 2
  c_open_cols: 2
  n_cap: 262144
  # GPU compute settings
  anchor_kind: heavy
  buffer_micro: 0.001
  buffer_heavy: 0.4
  stream_micro_priority: 1
  stream_heavy_priority: 0
  # Confidential Compute Attestation (Intel TDX, NVIDIA CC)
  cc_attestation_enabled: true
  cc_attestation_mode: "mock"

